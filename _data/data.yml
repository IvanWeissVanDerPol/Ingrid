career-profile:
  title: Career Profile
  summary: |
    Experienced IT Support Analyst with a strong background in banking systems and customer service. Proficient in SQL, PL/SQL, and various programming languages. Currently pursuing a degree in Informatics Engineering at Universidad Nacional de Asunción. Skilled in incident management, database reporting, and providing operational support for banking applications. Strong problem-solving abilities and excellent communication skills.
    
    You can contact me directly for a detailed PDF version of my resume.

